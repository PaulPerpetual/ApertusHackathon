<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urteilsradar</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="toolbar">
  <div class="seg" id="scope" role="tablist">
    <button data-scope="new" class="on"><span data-i18n="scope_new">Neu</span> <span class="count" id="cNew"></span></button>
    <button data-scope="all" data-i18n="scope_all">Alle</button>
    <button data-scope="border"><span data-i18n="scope_border">Grenzfälle</span> <span class="count" id="cBorder"></span></button>
  </div>
  <div class="spacer"></div>
  <label class="searchbox"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" data-i18n-placeholder="search"></label>
  <div class="filter-wrap">
    <button class="btn" id="filterBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true" width="13" height="13"><path d="M2 3h12l-4.6 5.4V13l-2.8-1.4V8.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> <span data-i18n="filter">Filter</span><span class="fcount" id="filterCount"></span></button>
    <div id="filterPop" class="filter-pop" hidden>
      <div class="fp-row"><span class="fp-label" data-i18n="period">Zeitraum</span>
        <div class="fp-ctl"><select id="monthSel" class="month-sel" aria-label="Monat / mois"></select>
          <label class="pub-toggle" title=""><input type="checkbox" id="pubToggle"> <span id="pubLabel"></span></label></div></div>
      <div class="fp-row"><span class="fp-label" data-i18n="min_relevance">Relevanz ab</span>
        <div class="fp-ctl"><input id="minScore" type="range" min="0" max="100" step="5"><output id="minScoreOut"></output></div></div>
      <div class="fp-row"><span class="fp-label" data-i18n="keywords">Schlagworte</span>
        <div class="fp-ctl"><select id="tagFilter"></select><span id="tagChips" class="tag-chips"></span></div></div>
      <div class="fp-row"><span class="fp-label" data-i18n="show">Anzeigen</span>
        <div class="fp-ctl fp-checks"><label><input type="checkbox" id="showRej"> <span data-i18n="show_rejected">Nicht relevante</span> <span class="count" id="cRej"></span></label></div></div>
      <div class="fp-foot"><button class="linkbtn" id="resetFilters" data-i18n="reset_all">Zurücksetzen</button></div>
    </div>
  </div>
  <button class="btn" id="addBtn"><span aria-hidden="true">＋</span> <span data-i18n="add">Urteil zusammenfassen</span></button>
  <a class="btn" href="hitlist" id="hitlistBtn" data-i18n="hitlist_btn">Trefferliste</a>
  <button class="btn" id="infoBtn" aria-haspopup="dialog"><span aria-hidden="true">ⓘ</span> <span data-i18n="info_btn">Info</span></button>
  <div class="seg small" role="group" aria-label="Sprache / langue">
    <button data-lang="de" class="on">DE</button><button data-lang="fr">FR</button>
  </div>
  <div class="menu-wrap">
    <button id="menuBtn" class="tool-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">⋯</button>
    <div id="menu" class="menu" hidden>
      <button id="editorBtn" class="menu-item"></button>
      <div class="menu-sep"></div>
      <div class="menu-row"><span data-i18n="preview_lines">Begründung in der Liste</span>
        <span class="seg mini" id="whyLines"><button data-lines="2">2</button><button data-lines="4">4</button><button data-lines="0" data-i18n="all_lines">alle</button></span></div>
      <div class="menu-sep"></div>
      <div class="menu-foot" id="modelInfo"></div>
    </div>
  </div>
</header>

<div class="filterbar">
  <span id="activeFilters" class="active-filters"></span>
  <div class="spacer"></div>
  <span id="listMeta" class="meta"></span>
</div>

<main id="layout">
  <section id="listPane" tabindex="0">
    <div class="mhead" id="mhead">
      <span></span>
      <button class="h-sort" data-sort="score" data-i18n="col_relevance">Relevanz</button>
      <span class="h-main"><button class="h-sort" data-sort="title" data-i18n="col_ruling">Urteil</button><button class="h-sort" data-sort="date" data-i18n="col_date">Entscheiddatum</button></span>
      <span></span>
    </div>
    <ol id="rows" class="mlist"></ol>
    <p id="empty" class="empty" hidden></p>
  </section>
  <div id="resizer" role="separator" aria-orientation="vertical" title="Ziehen zum Anpassen · Doppelklick: Standardbreite"></div>
  <aside id="panel" hidden>
    <div class="panel-head">
      <div class="panel-title">
        <div id="pDocket" class="docket"></div>
        <h2 id="pTitle"></h2>
      </div>
      <div class="panel-actions">
        <button id="pEdit" class="btn primary"></button>
        <button id="pCancel" class="btn" hidden></button>
        <button id="pReject" class="btn"></button>
        <button id="pDone" class="btn"></button>
        <button id="pExpand" class="tool-btn" aria-label="expand">⤢</button>
        <button id="closePanel" class="tool-btn" aria-label="close">✕</button>
      </div>
    </div>
    <div id="pBody"></div>
  </aside>
</main>

<dialog id="infoDlg" class="info-dlg">
  <form method="dialog">
    <div id="infoBody"></div>
    <div class="row"><button value="ok" class="btn primary" data-i18n="info_close">Verstanden</button></div>
  </form>
</dialog>
<dialog id="nameDlg">
  <form method="dialog">
    <h3 data-i18n="who">Wer bearbeitet?</h3>
    <p class="muted" data-i18n="who_hint">Ihr Name wird bei Änderungen angezeigt. Keine Anmeldung nötig.</p>
    <label class="field"><span data-i18n="name">Name</span><input id="nameInput" maxlength="60" autocomplete="name"></label>
    <label class="field" id="keyField"><span data-i18n="key">Editor-Schlüssel (nur Server)</span><input id="keyInput" type="password" autocomplete="off"></label>
    <div class="row"><button value="cancel" class="btn" data-i18n="cancel" formnovalidate>Abbrechen</button>
      <button value="ok" class="btn primary">OK</button></div>
  </form>
</dialog>

<dialog id="addDlg">
  <form method="dialog">
    <h3 data-i18n="add_title">Weiteres Urteil zusammenfassen</h3>
    <p class="muted" data-i18n="add_hint">Geschäftsnummer (z.B. 8C_145/2025) oder Link von bger.ch</p>
    <input id="addInput" required>
    <div class="row"><button value="cancel" class="btn" data-i18n="cancel" formnovalidate>Abbrechen</button>
      <button value="ok" class="btn primary" data-i18n="start">Zusammenfassen</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="static/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suva Urteilsradar</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">S</span><span data-i18n="app_title">Urteilsradar</span></div>
  <div class="views" role="tablist">
    <button data-view="radar" class="on" data-i18n="view_radar">Neue Urteile</button><button data-view="kb" data-i18n="view_kb">Archiv</button>
  </div>
  <input id="search" type="search" data-i18n-placeholder="search">
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Sprache / langue">
    <button data-lang="de" class="on">DE</button><button data-lang="fr">FR</button>
  </div>
  <div class="menu-wrap">
    <button id="menuBtn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">⋯</button>
    <div id="menu" class="menu" hidden>
      <button id="addBtn" class="menu-item" data-i18n="add">Urteil manuell hinzufügen</button>
      <button id="editorChip" class="menu-item"></button>
      <label class="menu-item toggle"><input id="showLow" type="checkbox"> <span data-i18n="show_low">Wenig relevante zeigen</span></label>
      <div class="menu-foot"><span id="modelBadge"></span></div>
    </div>
  </div>
</header>

<main id="layout">
  <section id="listPane">
    <div id="radarView">
      <div id="listMeta" class="meta"></div>
      <ol id="cards"></ol>
    </div>
    <div id="kbView" hidden>
      <div class="kb-filters">
        <div class="seg" id="kbKind">
          <button data-kind="" class="on" data-i18n="kind_all">Alle</button><button data-kind="suva" data-i18n="kind_suva">Suva</button><button data-kind="ai" data-i18n="kind_ai">KI</button><button data-kind="edited" data-i18n="kind_edited">Bearbeitet</button>
        </div>
        <div id="kbTags" class="tags"></div>
      </div>
      <div id="kbMeta" class="meta"></div>
      <ol id="kbList" class="kb-list"></ol>
    </div>
  </section>
  <aside id="panel" hidden>
    <div class="panel-head">
      <div>
        <div id="pDocket" class="docket"></div>
        <h2 id="pTitle"></h2>
      </div>
      <button id="closePanel" class="icon" aria-label="close">✕</button>
    </div>
    <div id="pBody"></div>
  </aside>
</main>

<dialog id="nameDlg">
  <form method="dialog">
    <h3 data-i18n="who">Wer bearbeitet?</h3>
    <p class="muted" data-i18n="who_hint">Ihr Name wird bei Änderungen angezeigt. Keine Anmeldung nötig.</p>
    <input id="nameInput" required maxlength="60" autocomplete="name">
    <div class="row"><button value="cancel" class="btn" data-i18n="cancel" formnovalidate>Abbrechen</button>
      <button id="nameOk" value="ok" class="btn primary">OK</button></div>
  </form>
</dialog>

<dialog id="addDlg">
  <form method="dialog">
    <h3 data-i18n="add_title">Weiteres Urteil zusammenfassen</h3>
    <p class="muted" data-i18n="add_hint">Geschäftsnummer (z.B. 8C_145/2025) oder Link von bger.ch</p>
    <input id="addInput" required>
    <div class="row"><button value="cancel" class="btn" data-i18n="cancel" formnovalidate>Abbrechen</button>
      <button value="ok" class="btn primary" data-i18n="start">Starten</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="static/app.js"></script>
</body>
</html>
